# CI rules.

[[rule]]
id = "CI-001"
title = "Shared security scan workflow is included"
level = "must"
check = { kind = "ci_includes", include = "acme/workflows/.github/workflows/security-scan.yml" }
remediation = { hint = "Call the reusable workflow acme/workflows/.github/workflows/security-scan.yml from a workflow on push.", scope = [".github/workflows/*.yml", ".github/workflows/*.yaml"] }

[[rule]]
id = "CI-002"
title = "GitLab pipelines include the shared templates"
level = "must"
applies_to = { paths = [".gitlab-ci.yml"] }
check = { kind = "ci_includes", include = "ops/ci-templates" }
remediation = { hint = "Add `include: - project: ops/ci-templates` to .gitlab-ci.yml.", scope = [".gitlab-ci.yml"] }
