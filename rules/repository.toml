# Baseline rules for every repository.

[[rule]]
id = "REPO-001"
title = "CODEOWNERS file with at least one owner"
level = "must"
check = { kind = "codeowners_present" }
remediation = { hint = "Add .github/CODEOWNERS (GitHub) or CODEOWNERS (GitLab) assigning the owning team.", scope = ["CODEOWNERS", ".github/CODEOWNERS", ".gitlab/CODEOWNERS", "docs/CODEOWNERS"] }

[[rule]]
id = "REPO-002"
title = "README present"
level = "should"
check = { kind = "file_exists", path = "README.md" }
remediation = { hint = "Add a README.md describing purpose, owners and how to run it.", scope = ["README.md"] }

[[rule]]
id = "REPO-003"
title = "No committed .env files"
level = "must"
check = { kind = "file_absent", path = "**/.env" }
remediation = { hint = "Remove .env files, rotate any secrets they held, and add .env to .gitignore.", scope = ["**/.env", ".gitignore"] }

[[rule]]
id = "DEP-001"
title = "Renovate extends the shared preset"
level = "should"
check = { kind = "renovate_extends", preset = "github>acme/renovate-config" }
remediation = { hint = "Create renovate.json with extends [\"github>acme/renovate-config\"].", scope = ["renovate.json", "renovate.json5", ".github/renovate.json", ".github/renovate.json5"] }
